name: sandbox-image

# Publishes the Zone B sandbox image to GHCR so installs can `docker pull`
# instead of building ~2 GB of tooling from source (PLAN.md, Option B).
#
# The installer falls back to a local build whenever the pull isn't available,
# so a failed run here never breaks installs — it only makes them slow again.
#
# Manual first run: Actions -> sandbox-image -> Run workflow (main). The
# workflow can't retro-publish for tags that predate it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag for this manual build"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase repository names, and the account name here
      # is mixed-case — derive a lowercased image ref once and reuse it.
      - name: Compute image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kryonsec-sandbox" \
            >> "$GITHUB_OUTPUT"

      # Kali + ~50 tools is a large image; the runner's default 14 GB disk has
      # exhausted itself on this build before. Drop toolchains we don't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/sandbox/Dockerfile.kali
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The digest is the point of this job (spec §8.6 wants the image pinned
      # by digest) — surface it so it can be copied into config.py.
      - name: Summary
        run: |
          {
            echo "## Sandbox image published"
            echo ""
            echo "Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo ""
            echo "Digest:"
            echo '```'
            echo "${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Installer picks this up by tag automatically. To pin the"
            echo "exact bytes a release was tested with, set \`sandbox_image\`"
            echo "in src/kryonsec/config.py to the digest ref above."
          } >> "$GITHUB_STEP_SUMMARY"
