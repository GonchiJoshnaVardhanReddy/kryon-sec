name: release-wheel

# Builds the distributable wheel and attaches it to the GitHub Release for the
# tag. This is the artifact kryonsec.in serves: install.sh downloads a wheel
# and pip-installs it, so nothing in the install path needs this repository to
# be public.
#
# The repo is private, so the Release is private too — whoever serves the
# download (the n8n workflow behind kryonsec.in/api/download) needs a token
# with read access to fetch the asset from here. See RELEASING.md.
#
# Manual run: Actions -> release-wheel -> Run workflow. Re-running a tag
# replaces the attached wheel rather than failing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a wheel for (e.g. v1.3.2)"
        required: true

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    # Publish only from the canonical repo, for the same reason the sandbox
    # image workflow does: this file travels with the source, and a copy
    # elsewhere must never publish a release that installs would pick up.
    if: github.repository == 'GonchiJoshnaVardhanReddy/kryon-sec'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --quiet --upgrade build
          python -m build --wheel

      # A wheel with no version, or one that disagrees with the tag, installs
      # fine and then reports the wrong version in doctor — check rather than
      # discover it on a customer's machine.
      - name: Check the wheel matches the tag
        run: |
          ls -l dist/
          WHEEL=$(ls dist/*.whl)
          echo "built: $WHEEL"
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$WHEEL" in
            *"${TAG#v}"*) echo "version matches ${TAG#v}" ;;
            *) echo "::error::$WHEEL does not match tag $TAG"; exit 1 ;;
          esac

      # gh is preinstalled on the runner — no third-party release action in a
      # project whose whole point is a small, auditable toolchain.
      - name: Attach the wheel to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          WHEEL=$(ls dist/*.whl)
          # --clobber: re-running a tag replaces the asset instead of erroring,
          # which is what you want when a build was cut wrong and re-cut.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --notes "Kryonsec $TAG"
          gh release upload "$TAG" "$WHEEL" --clobber

      - name: Summary
        run: |
          {
            echo "## Wheel released"
            echo ""
            echo "\`$(ls dist/*.whl)\` is attached to the release for"
            echo "\`${{ inputs.tag || github.ref_name }}\`."
            echo ""
            echo "Next: point \`kryonsec.in/api/download\` at this asset (see"
            echo "RELEASING.md). Until that exists, members can install with"
            echo "\`KRYONSEC_WHEEL=<path-to-this-file>\`."
          } >> "$GITHUB_STEP_SUMMARY"
