[build-system]
# PEP 639 (license as an SPDX string) needs setuptools >= 77; older
# setuptools would treat the string `license` as an error.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kryonsec"
version = "1.3.11"
description = "Single-user CLI cybersecurity platform: conversational copilot + deterministic purple-team engine"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 SPDX string form. Empirically verified against setuptools>=77
# (Phase 7 preflight): the old table form `license = { text = "Proprietary" }`
# still builds but emits a SetuptoolsDeprecationWarning on every build
# (removal deadline 2027-Feb-18), the bare string "Proprietary" is rejected
# outright because it is not a valid SPDX expression, and
# "LicenseRef-Proprietary" builds cleanly to `License-Expression:
# LicenseRef-Proprietary`. Guarded by tests/test_packaging.py.
license = "LicenseRef-Proprietary"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
    "prompt_toolkit>=3.0",
    "jinja2>=3.1",
    "rich>=13.7",
    "textual>=8.0",
    # the shipped docsafe provider imports the 2.x SDK layout
    # (`mcp.server.mcpserver`) — a 1.x install satisfies nothing here
    "mcp>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
kryonsec = "kryonsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# templates/ and containers/ are loaded at runtime relative to the package
# (__file__), so they must ship inside the wheel — not just the repo.
# NOTE: only the seccomp JSON ships here. The sandbox image sources
# (containers/sandbox/*, incl. Dockerfile.kali and scripts/) are NOT in the
# wheel — install.sh clones the repo to build the image, so nothing under
# containers/sandbox should ever be added to package-data.
kryonsec = [
    "templates/*.jinja",
    "containers/*.json",
    # The nuclei template manifest (Phase 2B.8) is the reviewed, hash-pinned
    # allowlist the adapter loads from the package — it MUST ship in the
    # wheel or Nuclei execution refuses to enable. It lives in the purple
    # subpackage (adapter_nuclei.py resolves it next to itself via
    # __file__), so the pattern carries the DIRECTORY: a bare
    # "nuclei_manifest.json" here resolves against src/kryonsec/ and
    # matches nothing — v1.3.10's wheel shipped without the manifest and a
    # wheel-installed RECON_ACTIVE raised NucleiPolicyError (fail-closed;
    # caught in the v1.3.11 release preflight, guarded by
    # tests/test_packaging.py).
    "purple/nuclei_manifest.json",
    # The specialist skill packs (Batch 4D) are reviewed, read-only
    # markdown knowledge the skills registry loads from the package —
    # same rule as the nuclei manifest: they MUST ship in the wheel, and
    # the pattern carries the DIRECTORY (a bare glob here resolves
    # against src/kryonsec/ and matches nothing).
    "purple/skills/*.md",
    # The memory browser's page, style and scripts, plus the brand mark and
    # the two fonts it serves. These must ship in the wheel: `kryonsec memory`
    # reads them off disk at request time, and a wheel without them would
    # serve a page with no face. A glob does not recurse, so the fonts/ and
    # assets/ subdirectories are named explicitly.
    "memory/static/*",
    "memory/static/assets/*",
    "memory/static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
